name: Android CI

on:
  push:
    branches: [ "main" ] # 본인의 기본 브랜치명에 맞게 유지 (main 혹은 master)
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: 자바(JDK) 설정
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: APK 빌드 (Debug)
      run: |
        cd SMB_APK_Project
        gradle assembleDebug

    - name: 생성된 APK 저장 및 업로드
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: SMB_APK_Project/app/build/outputs/apk/debug/app-debug.apk
