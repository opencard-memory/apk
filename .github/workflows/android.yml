Name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: 자바(JDK) 설정
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Gradlew 실행 권한 부여
      run: |
        TARGET_DIR=$(dirname $(find . -name "settings.gradle" | head -n 1))
        chmod +x "$TARGET_DIR/gradlew"

    - name: APK 빌드 (Debug)
      run: |
        TARGET_DIR=$(dirname $(find . -name "settings.gradle" | head -n 1))
        echo "Found project directory: $TARGET_DIR"
        cd "$TARGET_DIR"
        ./gradlew assembleDebug

    - name: 생성된 APK 저장 및 업로드
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
