name: Android CI

on:
  push:
    branches: [ "main" ] # 본인의 기본 브랜치 이름 (main 또는 master)
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: 자바(JDK) 설정
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' # 프로젝트에 맞는 자바 버전 (보통 11 또는 17)
        cache: 'gradle'

    - name: Gradle 실행 권한 부여
      run: chmod +x gradlew

    - name: APK 빌드 (Debug)
      run: ./gradlew assembleDebug

    - name: 생성된 APK 저장 및 업로드
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
